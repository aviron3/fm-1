# DUBWISE: build the FM-1 package on every push (the .fwsc is the run's "packages" artifact), then publish the web
# installer with it (Felucca's installer, web/make_site.py) to the gh-pages branch: GitHub Pages serves it over https,
# which Web MIDI needs. Uses the community's shared, pinned build workflow (JieLi's toolchain comes from JieLi's server).
name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: python -m pip install --quiet fonttools && ./build.sh
      packages: build/*.fwsc

  site:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: packages
          path: pkg
      - name: The installer site
        run: |
          set -e
          VER="0.1.$GITHUB_RUN_NUMBER"
          python3 web/make_site.py pkg/build/felucca.fwsc "$VER" site 2>/dev/null || python3 web/make_site.py pkg/felucca.fwsc "$VER" site
          cp pkg/build/felucca.fwsc site/dubwise.fwsc 2>/dev/null || cp pkg/felucca.fwsc site/dubwise.fwsc
          touch site/.nojekyll
          ls -R site | head -40
      - name: Publish to gh-pages
        run: |
          set -e
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "DUBWISE installer, build $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
